<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ホーム">
<title>ホームボード</title>
<!-- 時計用フォント。ブラウザは実際に使うものだけをダウンロードする -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300&family=Orbitron:wght@500&family=Outfit:wght@200&family=Share+Tech+Mono&display=swap">
<!--
  iPad mini 2 (iOS 12 / Safari 12) 向け。
  古い Safari でも動くように、JS は ES5、CSS は flex の gap などを使わずに書いている。
-->
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #0e1116;
    color: #e8eaed;
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 2s;
  }
  body.night { opacity: 0.45; }

  #app { display: -webkit-flex; display: flex; height: 100%; box-sizing: border-box; padding: 3vmin; }
  .left  { -webkit-flex: 1 1 0; flex: 1 1 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; margin-right: 3vmin; min-width: 0; }
  .right { -webkit-flex: 1 1 0; flex: 1 1 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; min-width: 0; }
  .card { background: #171b22; border-radius: 2vmin; padding: 2.5vmin 3vmin; box-sizing: border-box; }

  /* 時計 */
  .clock { padding-top: 1vmin; padding-bottom: 3vmin; }
  /* 時計の数字。既定は Bebas Neue で、時計をタップすると JS（FONTS）で切り替わる */
  .digits { font-family: "Bebas Neue", "DIN Condensed", "Arial Narrow", sans-serif; font-weight: normal; letter-spacing: 0.02em; cursor: pointer; }
  #time { font-size: 19vmin; line-height: 0.95; white-space: nowrap; }
  #sec { font-size: 0.37em; color: #7d8590; margin-left: 0.06em; } /* 時計本体と一緒に縮むよう em で指定 */
  #date { font-size: 4.6vmin; margin-top: 1.5vmin; color: #c9d1d9; }
  #date .hol { color: #ff7b72; font-size: 3.4vmin; margin-left: 1.5vmin; }

  /* 天気 */
  .weather { -webkit-flex: 1 1 auto; flex: 1 1 auto; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .wnow { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  #wicon { font-size: 9vmin; line-height: 1; margin-right: 2vmin; }
  #wtemp { font-size: 9vmin; font-weight: 300; line-height: 1; white-space: nowrap; }
  #wtemp small { font-size: 3.6vmin; color: #7d8590; }
  .wmeta { margin-left: 3vmin; font-size: 2.6vmin; color: #c9d1d9; line-height: 1.55; white-space: nowrap; min-width: 0; }
  #wdesc { font-size: 3.4vmin; color: #e8eaed; }
  #whum, #wwind { color: #7d8590; }
  #wwind.strong { color: #ffa657; }
  .hi { color: #ff9e64; } .lo { color: #79c0ff; }
  .loc { font-size: 2.4vmin; color: #7d8590; margin-bottom: 1.5vmin; }
  .loc span { border-bottom: 1px dotted #7d8590; }
  .fc { display: -webkit-flex; display: flex; margin-top: auto; padding-top: 2vmin; border-top: 1px solid #262c36; }
  .fc .d { -webkit-flex: 1 1 0; flex: 1 1 0; text-align: center; font-size: 2.6vmin; line-height: 1.45; }
  .fc .d .n { color: #7d8590; }
  .fc .d .i { font-size: 5vmin; line-height: 1.3; }
  .fc .d .r { color: #79c0ff; font-size: 2.3vmin; }
  .fc .d.sun .n, .fc .d.hol .n { color: #ff7b72; }
  .fc .d.sat .n { color: #79c0ff; }

  /* カレンダー */
  /* 古い Safari は flex 内の table を縦に伸ばせないので、カレンダーは固定サイズにして
     残りの高さは下の時間別予報に任せる */
  .cal { -webkit-flex: 0 0 auto; flex: 0 0 auto; }
  #calTitle { font-size: 4.2vmin; margin-bottom: 1vmin; }
  #calTitle small { font-size: 2.6vmin; color: #7d8590; margin-left: 1vmin; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { font-size: 2.4vmin; font-weight: normal; color: #7d8590; padding-bottom: 0.5vmin; }
  /* --cell は高さが足りないときに JS（fitCalendar）が縮める */
  td { text-align: center; font-size: calc(var(--cell, 5.6vmin) * 0.57); font-variant-numeric: tabular-nums; padding: 0.3vmin 0; }
  td span { display: inline-block; width: var(--cell, 5.6vmin); height: var(--cell, 5.6vmin); line-height: var(--cell, 5.6vmin); border-radius: 50%; }
  .sun, th.sun { color: #ff7b72; }
  .sat, th.sat { color: #79c0ff; }
  td.hol { color: #ff7b72; }
  td.other { opacity: 0.25; }
  td.today span { background: #e8eaed; color: #0e1116; font-weight: 600; }
  #holList { font-size: 2.4vmin; color: #c9d1d9; margin-top: 1.5vmin; line-height: 1.6; min-height: 2.4vmin; }
  #holList b { color: #ff7b72; font-weight: normal; margin-right: 1vmin; }

  /* 時間別予報 */
  .hourly { -webkit-flex: 1 1 auto; flex: 1 1 auto; margin-top: 3vmin; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .hourly .ttl { font-size: 2.4vmin; color: #7d8590; }
  #hr { -webkit-flex: 1 1 auto; flex: 1 1 auto; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  #hr .h { -webkit-flex: 1 1 0; flex: 1 1 0; text-align: center; font-size: 2.5vmin; line-height: 1.4; }
  #hr .h .t { color: #7d8590; }
  #hr .h .i { font-size: 4.4vmin; line-height: 1.3; }
  #hr .h .r { color: #79c0ff; font-size: 2.2vmin; }
  #hr .h .w { color: #7d8590; font-size: 2.2vmin; }
  #hr .h .w.strong { color: #ffa657; }

  #status { position: fixed; right: 3vmin; bottom: 1vmin; font-size: 1.8vmin; color: #4b535d; }
  #toast { position: fixed; left: 50%; top: 4vmin; -webkit-transform: translateX(-50%); transform: translateX(-50%); background: rgba(40, 46, 56, 0.92); color: #e8eaed; font-size: 3vmin; padding: 1.5vmin 3vmin; border-radius: 4vmin; white-space: nowrap; opacity: 0; -webkit-transition: opacity 0.3s; transition: opacity 0.3s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #toast small { color: #7d8590; font-size: 2.2vmin; margin-left: 1.5vmin; }

  /* 2 ページを横に並べ、スワイプで translate して切り替える */
  #viewport { height: 100%; overflow: hidden; }
  #pages { display: -webkit-flex; display: flex; width: 200%; height: 100%; -webkit-transition: -webkit-transform 0.4s ease; transition: transform 0.4s ease; }
  #pages.p1 { -webkit-transform: translateX(-50%); transform: translateX(-50%); }
  .page { -webkit-flex: 0 0 50%; flex: 0 0 50%; width: 50%; }
  #dots { position: fixed; left: 0; right: 0; bottom: 1.2vmin; text-align: center; line-height: 0; }
  #dots i { display: inline-block; width: 1.4vmin; height: 1.4vmin; border-radius: 50%; background: #39414c; margin: 0 0.8vmin; }
  #dots i.on { background: #c9d1d9; }

  /* 大きい時計のページ */
  #big { height: 100%; box-sizing: border-box; padding: 2vmin 3vmin 5vmin; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; text-align: center; }
  #btime { font-size: 50vmin; line-height: 0.9; white-space: nowrap; }
  #bsec { font-size: 0.26em; color: #7d8590; margin-left: 0.04em; }
  #bdate { font-size: 7.5vmin; color: #c9d1d9; margin-top: 1vmin; }
  #bdate .hol { color: #ff7b72; font-size: 5.5vmin; margin-left: 2vmin; }
  .bw { display: -webkit-flex; display: flex; -webkit-justify-content: center; justify-content: center; margin-top: 4vmin; }
  .bw .d { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin: 0 5vmin; font-size: 4.5vmin; color: #c9d1d9; text-align: left; line-height: 1.4; }
  .bw .d .i { font-size: 11vmin; line-height: 1; margin-right: 2.5vmin; }
  .bw .d .n { color: #7d8590; font-size: 3.6vmin; }

  /* 縦置きのとき */
  @media (orientation: portrait) {
    #app { -webkit-flex-direction: column; flex-direction: column; }
    /* 縦は高さが足りないので、時計を少し小さくし、時間別予報と祝日一覧は出さない
       （祝日はカレンダーの赤字と、当日の日付の横に出る） */
    #holList { display: none; }
    .left { margin-right: 0; margin-bottom: 3vmin; -webkit-flex: 0 0 auto; flex: 0 0 auto; }
    .right { -webkit-flex: 1 1 auto; flex: 1 1 auto; min-height: 0; }
    .clock { padding-top: 0; padding-bottom: 2vmin; }
    #time { font-size: 15vmin; }
    #date { margin-top: 1vmin; font-size: 4vmin; }
    .loc { margin-bottom: 0.5vmin; }
    .fc { margin-top: 1.5vmin; padding-top: 1.5vmin; }
    .fc .d { line-height: 1.3; }
    .fc .d .i { font-size: 4vmin; }
    .hourly { display: none; }
    #btime { font-size: 40vmin; }
    .bw { -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; }
    .bw .d { margin: 1.5vmin 0; }
  }
</style>
</head>
<body>
<div id="viewport"><div id="pages">
<div id="app" class="page">
  <div class="left">
    <div class="clock">
      <div id="time" class="digits">--:--<span id="sec"></span></div>
      <div id="date"></div>
    </div>
    <div class="card weather">
      <div class="loc">📍 <span id="locName" title="タップで地域を変更">---</span></div>
      <div class="wnow">
        <div id="wicon">…</div>
        <div id="wtemp">--<small>°C</small></div>
        <div class="wmeta">
          <div id="wdesc">読み込み中</div>
          <div><span class="hi" id="whi">--</span> / <span class="lo" id="wlo">--</span>　💧<span id="wrain">--</span>%</div>

          <div id="whum"></div>
          <div id="wwind"></div>
        </div>
      </div>
      <div class="fc" id="fc"></div>
    </div>
  </div>
  <div class="right">
    <div class="card cal">
      <div id="calTitle"></div>
      <table id="calTable"></table>
      <div id="holList"></div>
    </div>
    <div class="card hourly">
      <div class="ttl">これからの天気（2時間ごと）</div>
      <div id="hr"></div>
    </div>
  </div>
</div>
<div id="big" class="page">
  <div id="btime" class="digits">--:--</div>
  <div id="bdate"></div>
  <div class="bw">
    <div class="d"><div class="i" id="b0i">…</div><div><div class="n">今日</div><div id="b0"></div></div></div>
    <div class="d"><div class="i" id="b1i">…</div><div><div class="n">明日</div><div id="b1"></div></div></div>
  </div>
</div>
</div></div>
<div id="dots"><i class="on"></i><i></i></div>
<div id="status"></div>
<div id="toast"></div>

<script>
(function () {
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var DEFAULT_LOC = { name: '東京', lat: 35.6895, lon: 139.6917 };
  var NIGHT_FROM = 23, NIGHT_TO = 6; // この時間帯は画面を暗くする

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function load(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function getJSON(url, ok, ng) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 20000;
    x.onload = function () {
      if (x.status >= 200 && x.status < 300) {
        var data;
        try { data = JSON.parse(x.responseText); } catch (e) { if (ng) ng(e); return; }
        ok(data);
      } else if (ng) ng(x.status);
    };
    x.onerror = x.ontimeout = function () { if (ng) ng('network'); };
    x.send();
  }

  var loc = load('loc', DEFAULT_LOC);
  var holidays = load('holidays', {});
  var lastDay = '', lastMin = -1;

  // ---- 時計 ----
  function tick() {
    var now = new Date();
    $('time').innerHTML = pad(now.getHours()) + ':' + pad(now.getMinutes()) +
      '<span id="sec">' + pad(now.getSeconds()) + '</span>';
    $('btime').innerHTML = pad(now.getHours()) + ':' + pad(now.getMinutes()) +
      '<span id="bsec">' + pad(now.getSeconds()) + '</span>';
    if (now.getMinutes() !== lastMin) { lastMin = now.getMinutes(); fitClocks(); }

    var h = now.getHours();
    var night = NIGHT_FROM > NIGHT_TO ? (h >= NIGHT_FROM || h < NIGHT_TO) : (h >= NIGHT_FROM && h < NIGHT_TO);
    document.body.className = night ? 'night' : '';

    var key = ymd(now);
    if (key !== lastDay) {
      lastDay = key;
      var hol = holidays[key];
      $('date').innerHTML = $('bdate').innerHTML =
        now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日（' + WD[now.getDay()] + '）' +
        (hol ? '<span class="hol">' + hol + '</span>' : '');
      renderCalendar(now);
    }
  }

  // ---- カレンダー ----
  function renderCalendar(now) {
    var y = now.getFullYear(), m = now.getMonth();
    $('calTitle').innerHTML = (m + 1) + '月<small>' + y + '</small>';

    var html = '<tr>';
    for (var i = 0; i < 7; i++) html += '<th class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + WD[i] + '</th>';
    html += '</tr>';

    var start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    var todayKey = ymd(now);
    var holList = [];
    for (var w = 0; w < 6; w++) {
      html += '<tr>';
      for (var d = 0; d < 7; d++) {
        var day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + d);
        var k = ymd(day);
        var cls = [];
        if (d === 0) cls.push('sun');
        if (d === 6) cls.push('sat');
        if (holidays[k]) cls.push('hol');
        if (day.getMonth() !== m) cls.push('other');
        else if (holidays[k]) holList.push('<b>' + day.getDate() + '日</b>' + holidays[k]);
        if (k === todayKey) cls.push('today');
        html += '<td class="' + cls.join(' ') + '"><span>' + day.getDate() + '</span></td>';
      }
      html += '</tr>';
      // 6週目が丸ごと翌月なら出さない
      if (new Date(start.getFullYear(), start.getMonth(), start.getDate() + (w + 1) * 7).getMonth() !== m) break;
    }
    $('calTable').innerHTML = html;
    $('holList').innerHTML = holList.join('　');
    fitCalendar();
  }

  // カレンダーが右（縦置きなら下）の枠からはみ出すなら、マス目を少しずつ縮める
  function fitCalendar() {
    var root = document.documentElement, size = 5.6;
    var box = document.querySelector('.right'), cal = document.querySelector('.cal');
    root.style.setProperty('--cell', size + 'vmin');
    while (size > 3 && cal.getBoundingClientRect().bottom > box.getBoundingClientRect().bottom + 0.5) {
      size -= 0.2;
      root.style.setProperty('--cell', size + 'vmin');
    }
  }

  // ---- 祝日 ----
  function updateHolidays() {
    getJSON('https://holidays-jp.github.io/api/v1/date.json', function (data) {
      holidays = data;
      save('holidays', data);
      lastDay = ''; // 次の tick で再描画
    });
  }

  // ---- 天気（Open-Meteo, キー不要）----
  var WCODE = {
    0: ['☀️', '快晴'], 1: ['🌤', '晴れ'], 2: ['⛅️', '晴れ時々曇り'], 3: ['☁️', '曇り'],
    45: ['🌫', '霧'], 48: ['🌫', '霧'],
    51: ['🌦', '弱い霧雨'], 53: ['🌦', '霧雨'], 55: ['🌧', '強い霧雨'], 56: ['🌧', '着氷性の霧雨'], 57: ['🌧', '着氷性の霧雨'],
    61: ['🌧', '小雨'], 63: ['🌧', '雨'], 65: ['🌧', '大雨'], 66: ['🌧', '着氷性の雨'], 67: ['🌧', '着氷性の雨'],
    71: ['🌨', '小雪'], 73: ['🌨', '雪'], 75: ['❄️', '大雪'], 77: ['🌨', '霧雪'],
    80: ['🌦', 'にわか雨'], 81: ['🌧', 'にわか雨'], 82: ['⛈', '激しいにわか雨'], 85: ['🌨', 'にわか雪'], 86: ['❄️', '強いにわか雪'],
    95: ['⛈', '雷雨'], 96: ['⛈', '雷雨（ひょう）'], 99: ['⛈', '激しい雷雨']
  };
  function wc(code) { return WCODE[code] || ['❓', '不明']; }

  // 風向（度）→ 16方位。風速 10m/s 以上は「強い」として色を変える
  var DIRS = ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東', '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'];
  var STRONG_WIND = 10;
  function dirName(deg) { return DIRS[Math.round(deg / 22.5) % 16]; }

  function updateWeather() {
    $('locName').innerHTML = loc.name;
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat + '&longitude=' + loc.lon +
      '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m' +
      '&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m' +
      '&wind_speed_unit=ms' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=Asia%2FTokyo&forecast_days=6';
    getJSON(url, function (w) {
      var c = w.current, dl = w.daily;
      var now = wc(c.weather_code);
      $('wicon').innerHTML = now[0];
      $('wdesc').innerHTML = now[1];
      $('wtemp').innerHTML = Math.round(c.temperature_2m) + '<small>°C</small>';
      $('whi').innerHTML = Math.round(dl.temperature_2m_max[0]) + '°';
      $('wlo').innerHTML = Math.round(dl.temperature_2m_min[0]) + '°';
      $('wrain').innerHTML = dl.precipitation_probability_max[0] == null ? '-' : dl.precipitation_probability_max[0];
      $('whum').innerHTML = '体感 ' + Math.round(c.apparent_temperature) + '°　湿度 ' + c.relative_humidity_2m + '%';
      $('wwind').innerHTML = '風 ' + dirName(c.wind_direction_10m) + ' ' + Math.round(c.wind_speed_10m) + 'm/s' +
        '（最大 ' + Math.round(c.wind_gusts_10m) + '）';
      $('wwind').className = c.wind_speed_10m >= STRONG_WIND ? 'strong' : '';

      var html = '';
      for (var i = 1; i < dl.time.length; i++) {
        var p = dl.time[i].split('-');
        var day = new Date(+p[0], +p[1] - 1, +p[2]);
        var cls = day.getDay() === 0 ? 'sun' : day.getDay() === 6 ? 'sat' : '';
        if (holidays[dl.time[i]]) cls += ' hol';
        var name = i === 1 ? '明日' : (day.getMonth() + 1) + '/' + day.getDate() + '(' + WD[day.getDay()] + ')';
        var rain = dl.precipitation_probability_max[i];
        html += '<div class="d ' + cls + '"><div class="n">' + name + '</div>' +
          '<div class="i">' + wc(dl.weather_code[i])[0] + '</div>' +
          '<div><span class="hi">' + Math.round(dl.temperature_2m_max[i]) + '°</span> <span class="lo">' + Math.round(dl.temperature_2m_min[i]) + '°</span></div>' +
          '<div class="r">💧' + (rain == null ? '-' : rain) + '%</div></div>';
      }
      $('fc').innerHTML = html;

      // 大きい時計のページ用：今日と明日
      for (var b = 0; b < 2; b++) {
        var bp = dl.precipitation_probability_max[b];
        $('b' + b + 'i').innerHTML = wc(dl.weather_code[b])[0];
        $('b' + b).innerHTML = wc(dl.weather_code[b])[1] + '<br>' +
          '<span class="hi">' + Math.round(dl.temperature_2m_max[b]) + '°</span> / <span class="lo">' + Math.round(dl.temperature_2m_min[b]) + '°</span>' +
          '　💧' + (bp == null ? '-' : bp) + '%';
      }

      // 時間別：現在の時刻から 2 時間ごとに 7 コマ
      var hr = w.hourly, start = 0, curHour = c.time.slice(0, 13);
      for (var j = 0; j < hr.time.length; j++) { if (hr.time[j].slice(0, 13) === curHour) { start = j; break; } }
      html = '';
      for (var k = 0; k < 7; k++) {
        var idx = start + k * 2;
        if (idx >= hr.time.length) break;
        var hh = +hr.time[idx].slice(11, 13);
        var pr = hr.precipitation_probability[idx];
        html += '<div class="h"><div class="t">' + (k === 0 ? '今' : hh + '時') + '</div>' +
          '<div class="i">' + wc(hr.weather_code[idx])[0] + '</div>' +
          '<div>' + Math.round(hr.temperature_2m[idx]) + '°</div>' +
          '<div class="r">💧' + (pr == null ? '-' : pr) + '%</div>' +
          '<div class="w' + (hr.wind_speed_10m[idx] >= STRONG_WIND ? ' strong' : '') + '">' + Math.round(hr.wind_speed_10m[idx]) + 'm/s</div></div>';
      }
      $('hr').innerHTML = html;
      fitCalendar(); // 天気が入ると縦置きでは上の段が伸びるので測り直す
      var t = new Date();
      $('status').innerHTML = '天気 ' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + ' 更新';
    }, function () {
      $('status').innerHTML = '天気の取得に失敗（再試行します）';
    });
  }

  // 地域名をタップすると変更できる
  $('locName').onclick = function () {
    var q = window.prompt('地域名を入力（例：横浜、札幌市、大阪）', loc.name);
    if (!q) return;
    getJSON('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ja&name=' + encodeURIComponent(q), function (r) {
      if (!r.results || !r.results.length) { window.alert('「' + q + '」が見つかりませんでした'); return; }
      var g = r.results[0];
      loc = { name: g.name, lat: g.latitude, lon: g.longitude };
      save('loc', loc);
      updateWeather();
    }, function () { window.alert('検索に失敗しました'); });
  };

  // ---- ページ切り替え（左右スワイプ、または下の点をタップ）----
  var page = load('page', 0);
  function showPage(p) {
    page = p;
    $('pages').className = p === 1 ? 'p1' : '';
    var dots = $('dots').getElementsByTagName('i');
    for (var i = 0; i < dots.length; i++) dots[i].className = i === p ? 'on' : '';
    save('page', p);
  }
  var sx = null, sy = null;
  document.addEventListener('touchstart', function (e) {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, false);
  document.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
    showPage(dx < 0 ? 1 : 0);
  }, false);
  // iOS の画面全体が引っぱられて揺れるのを止める
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  var dotEls = $('dots').getElementsByTagName('i');
  dotEls[0].onclick = function () { showPage(0); };
  dotEls[1].onclick = function () { showPage(1); };
  showPage(page);

  // ---- 時計のフォント（時計をタップで順に切り替え）----
  var FONTS = [
    { name: 'Bebas Neue', family: '"Bebas Neue", "DIN Condensed", sans-serif', weight: 'normal' },
    { name: 'Oswald', family: '"Oswald", "DIN Condensed", sans-serif', weight: '300' },
    { name: 'Orbitron', family: '"Orbitron", sans-serif', weight: '500' },
    { name: 'Outfit', family: '"Outfit", -apple-system, sans-serif', weight: '200' },
    { name: 'Share Tech Mono', family: '"Share Tech Mono", Menlo, monospace', weight: 'normal' },
    { name: 'DIN Condensed（内蔵）', family: '"DIN Condensed", "Arial Narrow", sans-serif', weight: 'bold' },
    { name: 'システム細字（内蔵）', family: '-apple-system, "Helvetica Neue", sans-serif', weight: '200' }
  ];
  var fontIdx = load('font', 0);
  if (!FONTS[fontIdx]) fontIdx = 0;
  var toastTimer = null;

  function applyFont(showName) {
    var f = FONTS[fontIdx];
    var els = [$('time'), $('btime')];
    for (var i = 0; i < els.length; i++) {
      els[i].style.fontFamily = f.family;
      els[i].style.fontWeight = f.weight;
    }
    fitClocks();
    // フォントのダウンロードが終わると幅が変わるので、読み込み後にもう一度合わせる
    if (document.fonts && document.fonts.load) {
      document.fonts.load(f.weight + ' 100px ' + f.family).then(fitClocks, fitClocks);
    }
    if (showName) {
      $('toast').innerHTML = f.name + '<small>' + (fontIdx + 1) + ' / ' + FONTS.length + '</small>';
      $('toast').className = 'show';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { $('toast').className = ''; }, 1800);
    }
  }
  function nextFont() {
    fontIdx = (fontIdx + 1) % FONTS.length;
    save('font', fontIdx);
    applyFont(true);
  }
  $('time').onclick = nextFont;
  $('btime').onclick = nextFont;

  // フォントによって横幅がかなり違うので、はみ出すときだけ文字を縮める
  function fitClocks() {
    var els = [$('time'), $('btime')];
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      el.style.fontSize = '';
      var r = document.createRange();
      r.selectNodeContents(el);
      var w = r.getBoundingClientRect().width, avail = el.clientWidth * 0.94;
      if (w > avail) {
        el.style.fontSize = (parseFloat(window.getComputedStyle(el).fontSize) * avail / w) + 'px';
      }
    }
  }
  window.addEventListener('resize', function () { setTimeout(fitClocks, 300); }, false);
  applyFont(false);
  // 向きを変えたら測り直す（回転直後はサイズが確定していないので少し待つ）
  window.addEventListener('resize', function () { setTimeout(fitCalendar, 300); }, false);

  tick();
  setInterval(tick, 1000);
  updateHolidays();
  updateWeather();
  setInterval(updateWeather, 30 * 60 * 1000);   // 30分ごと
  setInterval(updateHolidays, 24 * 60 * 60 * 1000);
  // 長時間つけっぱなしでも重くならないよう、毎日 4 時台に一度だけページを読み直す
  setInterval(function () {
    var n = new Date();
    if (n.getHours() === 4 && n.getMinutes() === 0) location.reload();
  }, 60 * 1000);
})();
</script>
</body>
</html>
